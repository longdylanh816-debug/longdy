<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STRIDE — Shoes built for motion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#111311;
    --paper:#F4F2EC;
    --citrus:#C7FF3D;
    --line:rgba(244,242,236,0.14);
    --muted:#9A9C93;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  .wrap{max-width:1100px;margin:0 auto;padding:0 28px;}

  header{
    position:sticky;top:env(safe-area-inset-top,0px);
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 28px;
    border-bottom:1px solid var(--line);
    background:rgba(17,19,17,0.85);
    backdrop-filter:blur(6px);
    z-index:10;
  }
  .logo{font-family:'Archivo Black',sans-serif;font-size:1.3rem;letter-spacing:-0.02em;}
  nav{display:flex;gap:28px;font-size:0.92rem;color:var(--muted);}
  nav a:hover{color:var(--paper);}
  .cta-small{
    background:var(--citrus);color:var(--ink);padding:9px 18px;border-radius:2px;
    font-weight:600;font-size:0.9rem;
  }

  .hero{
    padding:90px 28px 60px;
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;
    max-width:1100px;margin:0 auto;
  }
  .hero h1{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(2.6rem,6vw,4.4rem);
    line-height:0.98;
    letter-spacing:-0.01em;
  }
  .hero p{
    color:var(--muted);font-size:1.05rem;max-width:38ch;margin-top:22px;
  }
  .hero-ctas{display:flex;gap:14px;margin-top:34px;}
  .btn{
    padding:14px 26px;border-radius:2px;font-weight:600;font-size:0.95rem;
    display:inline-block;border:1px solid var(--paper);
  }
  .btn.primary{background:var(--citrus);color:var(--ink);border-color:var(--citrus);}
  .btn.ghost{color:var(--paper);}

  .hero-visual{
    aspect-ratio:1/1;background:
      radial-gradient(circle at 30% 30%, #2a2e28, #111311 70%);
    border:1px solid var(--line);border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
